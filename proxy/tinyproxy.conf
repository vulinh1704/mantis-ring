Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Notice
# Reachable only from the internal sandbox network, so any client there may use it.
Allow 0.0.0.0/0
# Hosts not matched by the allowlist are refused (403).
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
DisableViaHeader Yes
